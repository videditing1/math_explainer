[project]
name = "math-explainer"
version = "0.1.0"
description = "Tooling for 3b1b-style math explainer videos (Manim + AI narration + music)"
requires-python = ">=3.11"
dependencies = ["manim>=0.19", "numpy"]

[project.scripts]
explainer = "explainer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["explainer"]

[tool.setuptools.package-data]
explainer = ["template/*"]
